<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <h2 class="logo">MyPortfolio</h2>
      <ul class="nav-links">
        <li><a href="#home">Home</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#contact">Contact</a></li>
        <li><button id="theme-toggle">🌙</button></li>
      </ul>
    </div>
  </nav>

  <header id="home" class="header">
    <div class="container">
      <h1><span id="typed-text"></span></h1>
      <p>I create responsive and user-friendly websites.</p>
      <a href="#projects" class="btn">View My Work</a>
    </div>
  </header>

  <section id="projects" class="projects">
    <div class="container">
      <h2>My Projects</h2>
      <div class="project-grid">
        <div class="project-item">
          <img src="project1.jpg" alt="Project 1">
          <h3>Project 1</h3>
          <p>Description of project 1.</p>
        </div>
        <div class="project-item">
          <img src="project2.jpg" alt="Project 2">
          <h3>Project 2</h3>
          <p>Description of project 2.</p>
        </div>
      </div>
    </div>
  </section>

  <!-- <section id="contact" class="contact">
    <div class="container">
      <h2>Contact Me</h2>
      <p>Email: example@mail.com</p>
    </div>
  </section> -->
  <section id="contact" class="contact">
  <div class="container">
    <h2>Contact Me</h2>
    <form id="contact-form" novalidate>
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Your Name" required>
        <small class="error-message"></small>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Your Email" required>
        <small class="error-message"></small>
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="" rows="5" placeholder="Your Message" required></textarea>
        <small class="error-message"></small>
      </div>
      <button type="submit" class="btn">Send Message</button>
      <p id="form-status"></p>
    </form>
  </div>
</section>

<section id="footer" class="footer">
  <div class="container">
    <p>&copy; 2026 MyPortfolio. All rights reserved.</p>
  </div>
</section>

  <button id="back-to-top">↑</button>

  <script src="script.js"></script>
</body>
</html>
